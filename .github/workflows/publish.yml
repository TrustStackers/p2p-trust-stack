# Publishes @p2p-trust-stack/core and @p2p-trust-stack/app-api to npm when a
# version tag (v*) is pushed, using npm Trusted Publishing (OIDC) — no NPM_TOKEN
# secret is stored in the repo.
#
# One-time setup, PER PACKAGE, on npmjs.com (the package must already exist,
# which it does — 0.1.0 was published manually):
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : TrustStackers
#     Repository           : p2p-trust-stack
#     Workflow filename    : publish.yml
#     Environment          : (leave blank)
# The workflow filename must match this file EXACTLY, or npm will reject the
# OIDC exchange. Repeat for both @p2p-trust-stack/core and @p2p-trust-stack/app-api.
#
# `id-token: write` lets the npm CLI exchange GitHub's OIDC token for a
# short-lived publish token. The provenance attestation is generated
# automatically — do NOT add --provenance.
#
# node-version is 24, not 22: Node 22.x bundles npm 10.x, which is too old for
# OIDC trusted publishing, and self-upgrading npm on the runner is unreliable.
# The packages themselves still support node >= 22.5.0 (see engines).

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never cancel a publish mid-flight; two tags must not interleave.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish core + app-api to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # Node 24 ships npm >= 11, required for OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      # Same gates as ci.yml, so a tag can never publish a tree that would have
      # failed CI: SPDX headers, no copyleft runtime deps, then typecheck +
      # tests + packed-tarball smoke test.
      - name: License headers (SPDX)
        run: node scripts/add-spdx-headers.mjs --check packages

      - name: Dependency licenses (no copyleft runtime deps)
        run: node scripts/check-dependency-licenses.mjs

      - name: Verify
        run: npm run verify

      # Order matters: app-api depends on core ^0.1.0, which must exist on the
      # registry first. `publishConfig.access = public` is already set on both
      # packages and `prepublishOnly` rebuilds dist/ before packing.
      - name: Publish @p2p-trust-stack/core
        run: npm publish --workspace @p2p-trust-stack/core

      - name: Publish @p2p-trust-stack/app-api
        run: npm publish --workspace @p2p-trust-stack/app-api
